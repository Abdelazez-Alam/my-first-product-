<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdalazez Alzayat | Web Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#08080F;
  color:#EDE9FE;
  line-height:1.7;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
::selection{background:#8b5cf6;color:#fff}

/* BACKGROUND ORBS */
.bg-fixed{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 600px at 15% 10%, rgba(139,92,246,0.22), transparent 60%),
    radial-gradient(800px 500px at 85% 15%, rgba(56,189,248,0.18), transparent 60%),
    radial-gradient(700px 500px at 50% 90%, rgba(236,72,153,0.15), transparent 60%),
    #08080F;
}

/* NAVBAR */
.navbar{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px) saturate(180%);
  background:rgba(12,10,24,0.7);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.nav-inner{
  max-width:1180px;margin:0 auto;
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:18px;letter-spacing:-0.02em;
  font-family:'Space Grotesk', 'Inter', sans-serif;
}
.logo-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#8b5cf6,#38bdf8);
  display:grid;place-items:center;
  font-weight:700;color:#fff;
  box-shadow:0 8px 24px rgba(139,92,246,0.35);
  font-family:'Space Grotesk', sans-serif;
}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{
  padding:8px 16px;border-radius:999px;
  font-size:14px;font-weight:500;
  color:rgba(255,255,255,0.65);
  transition:all .25s ease;
}
.nav-links a:hover{background:rgba(255,255,255,0.08);color:#fff}
.nav-cta{
  background:#fff !important;color:#0a0a12 !important;
  font-weight:700 !important;
  box-shadow:0 6px 20px rgba(255,255,255,0.15);
}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(255,255,255,0.22)}

/* HERO */
.hero{
  max-width:1180px;margin:0 auto;
  padding:92px 24px 60px;
  display:grid;grid-template-columns:1.15fr .85fr;
  gap:36px;align-items:center;
  min-height:84vh;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:999px;
  background:rgba(139,92,246,0.12);
  border:1px solid rgba(139,92,246,0.25);
  font-size:12.5px;font-weight:600;letter-spacing:0.04em;
  color:#c4b5fd;
}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:#a78bfa;box-shadow:0 0 10px #a78bfa;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{
  margin:20px 0 14px;
  font-size:clamp(36px,5.2vw,64px);
  line-height:1.05;font-weight:700;letter-spacing:-0.03em;
  font-family:'Space Grotesk','Inter',sans-serif;
}
.hero h1 span{
  background:linear-gradient(100deg,#a78bfa 10%,#38bdf8 45%,#f472b6 85%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{
  font-size:clamp(16px,1.6vw,19px);
  color:rgba(255,255,255,0.62);
  max-width:52ch;font-weight:400;line-height:1.8;
}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:13px 24px;border-radius:14px;
  font-weight:600;font-size:15px;
  transition:all .25s cubic-bezier(.2,.8,.2,1);
  border:1px solid transparent;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.btn-primary{
  background:#fff;color:#0a0a12;
  box-shadow:0 12px 32px rgba(255,255,255,0.16), 0 0 0 1px rgba(255,255,255,0.1) inset;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(255,255,255,0.22)}
.btn-ghost{
  background:rgba(255,255,255,0.06);
  border-color:rgba(255,255,255,0.12);
  color:#fff;backdrop-filter:blur(12px);
}
.btn-ghost:hover{background:rgba(255,255,255,0.11);transform:translateY(-2px)}

/* HERO VISUAL */
.visual-wrap{position:relative}
.visual-card{
  position:relative;
  border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,0.09),rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.10);
  backdrop-filter:blur(24px) saturate(150%);
  padding:18px;
  box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
  overflow:hidden;
}
.visual-top{
  height:260px;border-radius:18px;
  background:
    radial-gradient(400px 200px at 30% 20%, rgba(139,92,246,0.5), transparent 60%),
    radial-gradient(300px 200px at 80% 80%, rgba(56,189,248,0.5), transparent 60%),
    linear-gradient(135deg,#1e1b4b,#312e81 45%,#1e293b);
  position:relative;overflow:hidden;
}
.code-lines{
  position:absolute;inset:18px;
  font-family:ui-monospace,Menlo,Monaco,monospace;
  font-size:12px;line-height:1.9;color:rgba(255,255,255,0.7);
  direction:ltr;text-align:left;
}
.code-lines b{color:#a78bfa}
.code-lines i{color:#38bdf8;font-style:normal}
.code-lines em{color:#f472b6;font-style:normal}
.visual-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;padding:14px 16px;
}
.stat-num{font-size:22px;font-weight:800;line-height:1;font-family:'Space Grotesk',sans-serif}
.stat-label{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px}

/* SECTIONS SHARED */
.section{max-width:1180px;margin:0 auto;padding:88px 24px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:36px;flex-wrap:wrap}
.section-kicker{font-size:12px;letter-spacing:0.14em;font-weight:700;color:#a78bfa;text-transform:uppercase}
.section-title{font-size:clamp(28px,3.2vw,40px);font-weight:700;letter-spacing:-0.02em;line-height:1.15;margin-top:8px;font-family:'Space Grotesk','Inter',sans-serif}
.section-desc{color:rgba(255,255,255,0.55);max-width:46ch;font-size:15.5px}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
.about-card{
  border-radius:22px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  padding:28px;
}
.about-card p{color:rgba(255,255,255,0.68);font-size:16px;line-height:1.9}
.about-card p + p{margin-top:16px}

/* PROJECTS */
